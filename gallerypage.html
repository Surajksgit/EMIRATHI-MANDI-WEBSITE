<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>

    <style>
        /* Specific styles for the gallery page */
        .gallery-section {
            padding: 5vh 5% 15vh 5%;
            background-color: var(--bg-color);
            position: relative;
            z-index: 2;
        }

        .gallery-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
            filter: brightness(0.85);
            will-change: transform;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Create aesthetic masonry layout feel */
        .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(4) { grid-column: span 2; }
        .gallery-item:nth-child(7) { grid-row: span 2; }
        .gallery-item:nth-child(8) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(10) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(13) { grid-column: span 2; grid-row: span 2; }
        
        /* Hero tweaks */
        .hero {
            height: 100vh;
        }
        
        .hero-img-container {
            height: 60vh;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                grid-auto-rows: 200px;
                gap: 1rem;
            }
            .hero {
                height: 50vh;
            }
            .hero-img-container {
                height: 30vh;
                margin-top: 5vh;
            }
            .gallery-section {
                padding-top: 10vh;
            }
            /* Reset specific spans on mobile for vertical scrolling flow */
            .gallery-item:nth-child(1),
            .gallery-item:nth-child(4),
            .gallery-item:nth-child(7),
            .gallery-item:nth-child(8),
            .gallery-item:nth-child(10),
            .gallery-item:nth-child(13) {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Reactive Cursor -->
    <div class="cursor"></div>

    <!-- Navigation -->
    <nav class="navbar">

        </a>
        <button class="menu-toggle" id="mobile-toggle" aria-label="Toggle Menu">
            <span class="hamburger-line"></span>

            <li><a href="index.html#about" class="magnetic" data-strength="20">Vision</a></li>

            <li><a href="location.html" class="magnetic" data-strength="20">Location</a></li>

    </nav>

    <div class="mobile-overlay" id="mobile-menu">

        </button>   
        <div class="mobile-menu-inner">
            <ul class="mobile-nav-links">
                <li><a href="#about" class="mobile-link">Vision</a></li>
                <li><a href="menu.html" class="mobile-link">Menu</a></li>
                <li><a href="viewmenu.html" class="mobile-link">Visual Menu</a></li>
                <li><a href="location.html" class="mobile-link">Location</a></li>
                <li><a href="reservations.html" class="mobile-link btn-mobile-cta">Reservations</a></li>

            <div class="mobile-menu-footer">

    </div>

    <main id="smooth-wrapper">

                    <div class="gallery-item"><img src="galary/fish.jpeg" alt="Mandi Detail"></div>
                    <div class="gallery-item"><img src="galary/emirathi_interior.png" alt="Plated Mandi"></div>

                    <div class="gallery-item"><img src="galary/afghanishawayamandinew.png" alt="Alfam Mandi"></div>
                    <div class="gallery-item"><img src="galary/lamp1.png" alt="lamp1"></div>
                    <div class="gallery-item"><img src="galary/lamp2.png" alt="lamp2"></div>
                    <div class="gallery-item"><img src="galary/majlis.png" alt="majlis"></div>
                    <div class="gallery-item"><img src="galary/ilove.png" alt="ilove"></div>
                    <div class="gallery-item"><img src="galary/masalashawaya chicken.png" alt="masalashawaya2"></div>
                    <div class="gallery-item"><img src="galary/fish1.jpeg" alt="fish1"></div>

            <!-- Footer -->

                <div class="footer-links">
                    <a href="index.html" class="magnetic" data-strength="20">Home</a>
                    <a href="menu.html" class="magnetic" data-strength="20">Menu</a>

                </div>
            </footer>
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        const toggle = document.getElementById('mobile-toggle');
        const closeBtn = document.getElementById('mobile-close');
        const menu = document.getElementById('mobile-menu');
        const links = document.querySelectorAll('.mobile-link');

        const toggleMenu = (state) => {
            const isOpen = state !== undefined ? state : !menu.classList.contains('active');

            menu.classList.toggle('active', isOpen);
            toggle.classList.toggle('active', isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : '';
        };

        // Open/Close via hamburger
        toggle.addEventListener('click', () => toggleMenu());

        // Close via dedicated button
        closeBtn.addEventListener('click', () => toggleMenu(false));

        // Close via links
        links.forEach(link => {
            link.addEventListener('click', () => toggleMenu(false));
        });
    </script>
</body>
</html>
