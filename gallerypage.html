    <style>
        /* Specific styles for the gallery page */
        .gallery-section {
            padding: 5vh 5% 15vh 5%;
            background-color: var(--bg-color);
            position: relative;
            z-index: 2;
        }

        .gallery-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
            filter: brightness(0.85);
            will-change: transform;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Create aesthetic masonry layout feel */
        .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(4) { grid-column: span 2; }
        .gallery-item:nth-child(7) { grid-row: span 2; }
        .gallery-item:nth-child(8) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(10) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(13) { grid-column: span 2; grid-row: span 2; }
        
        /* Hero tweaks */
        .hero {
            height: 100vh;
        }
        
        .hero-img-container {
            height: 60vh;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                grid-auto-rows: 200px;
                gap: 1rem;
            }
            .hero {
                height: 50vh;
            }
            .hero-img-container {
                height: 30vh;
                margin-top: 5vh;
            }
            .gallery-section {
                padding-top: 10vh;
            }
            /* Reset specific spans on mobile for vertical scrolling flow */
            .gallery-item:nth-child(1),
            .gallery-item:nth-child(4),
            .gallery-item:nth-child(7),
            .gallery-item:nth-child(8),
            .gallery-item:nth-child(10),
            .gallery-item:nth-child(13) {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        const toggle = document.getElementById('mobile-toggle');
        const closeBtn = document.getElementById('mobile-close');
        const menu = document.getElementById('mobile-menu');
        const links = document.querySelectorAll('.mobile-link');

        const toggleMenu = (state) => {
            const isOpen = state !== undefined ? state : !menu.classList.contains('active');

            menu.classList.toggle('active', isOpen);
            toggle.classList.toggle('active', isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : '';
        };

        // Open/Close via hamburger
        toggle.addEventListener('click', () => toggleMenu());

        // Close via dedicated button
        closeBtn.addEventListener('click', () => toggleMenu(false));

        // Close via links
        links.forEach(link => {
            link.addEventListener('click', () => toggleMenu(false));
        });
    </script>
