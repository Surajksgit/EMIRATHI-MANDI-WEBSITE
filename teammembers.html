<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team - EMIRATHI'S MANDI</title>
    <!-- icon -->
    <link rel="icon" href="logo/emirathiicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>

    <style>
        /* Specific styles for the team page */
        .team-section {
            padding: 5vh 5% 15vh 5%;
            background-color: var(--bg-color);
            position: relative;
            z-index: 2;
        }

        .team-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 4rem 2rem;
            justify-items: center;
        }

        .team-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .team-image-wrapper {
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
            border-radius: 4px;
        }

        .team-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(11, 11, 11, 0.8) 0%, transparent 40%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .team-card:hover .team-image-wrapper::after {
            opacity: 1;
        }

        .team-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.8);
            transition: filter 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, filter;
        }

        .team-card:hover .team-img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.05);
        }

        .team-name {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .team-role {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            font-weight: 400;
        }

        /* Hero tweaks */
        .hero {
            height: 100vh;
        }
        
        .hero-img-container {
            height: 60vh;
        }

        @media (max-width: 900px) {
            .team-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 3rem 1.5rem;
            }
            .hero {
                height: 50vh;
            }
            .hero-img-container {
                height: 30vh;
                margin-top: 5vh;
            }
            .team-section {
                padding-top: 10vh;
            }
            .team-name {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Reactive Cursor -->
    <div class="cursor"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo magnetic" data-strength="20">
            <img src="logo/emirathiicon.png" alt="Emirathi's Mandi Logo" class="logo-img">
            <span class="logo-text">EMIRATHI'S MANDI</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html#about" class="magnetic" data-strength="20">Vision</a></li>
            <li><a href="menu.html" class="magnetic" data-strength="20">Menu</a></li>
            <li><a href="viewmenu.html" class="magnetic" data-strength="20">Visual Menu</a></li>
            <li><a href="gallerypage.html" class="magnetic" data-strength="20">Gallery</a></li>
            <li><a href="location.html" class="magnetic" data-strength="20">Location</a></li>
            <li><a href="index.html#reservations" class="magnetic btn-primary" data-strength="40">Reservations</a></li>
        </ul>
    </nav>

    <main id="smooth-wrapper">
        <div id="smooth-content">
            <!-- 1. Hero Section -->
            <section class="hero">
                <div class="hero-text">
                    <h1 class="hero-title">
                        <span class="line"><span class="word">Meet</span></span>
                        <span class="line"><span class="word">Our Team</span></span>
                    </h1>
                </div>
                <!-- Hero image that will scale up/parallax -->
                <div class="hero-img-container">
                    <img src="galary/team2.jpg" class="hero-img" alt="Chef plating meal">
                </div>
            </section>

            <!-- 2. Team Section -->
            <section class="team-section" id="team">
                <div class="team-grid">
                    
                    <!-- Team Member 1 -->
                    <div class="team-card">
                        <div class="team-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?q=80&w=1984&auto=format&fit=crop" class="team-img" alt="Head Chef">
                        </div>
                        <h3 class="team-name">Aneer CM</h3>
                        <span class="team-role">CEO/Founder</span>
                    </div>

                    <!-- Team Member 2 -->
                    <div class="team-card">
                        <div class="team-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1600565152252-41dc5a6e7f8b?q=80&w=2070&auto=format&fit=crop" class="team-img" alt="Sous Chef">
                        </div>
                        <h3 class="team-name">Shahul Hameed</h3>
                        <span class="team-role">General Manager</span>
                    </div>

                    <!-- Team Member 3 -->
                    <div class="team-card">
                        <div class="team-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c?q=80&w=1977&auto=format&fit=crop" class="team-img" alt="Pastry Chef">
                        </div>
                        <h3 class="team-name">Safar A</h3>
                        <span class="team-role">Assistant Manager</span>
                    </div>

                    <!-- Team Member 4 -->
                    <!-- <div class="team-card">
                        <div class="team-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?q=80&w=1986&auto=format&fit=crop" class="team-img" alt="Restaurant Manager">
                        </div>
                        <h3 class="team-name">Amar Al-Maktoum</h3>
                        <span class="team-role">General Manager</span>
                    </div> -->

                </div>
            </section>

            <!-- Footer -->
            <footer class="footer" id="reservations">
                <h2 class="footer-title magnetic" data-strength="50">Book Majlis</h2>
                <div class="footer-links">
                    <a href="index.html" class="magnetic" data-strength="20">Home</a>
                    <a href="location.html" class="magnetic" data-strength="20">Location</a>
                    <a href="teammembers.html" class="magnetic" data-strength="20">Team</a>
                </div>
            </footer>
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
